# /etc/ssh/sshd_config.d/dcrelay.conf — forward-only account for the tunnel.
# PermitListen (OpenSSH 7.8+) pins the remote -R bind to loopback; PermitOpen is
# NOT a substitute (it gates -L forwards, not -R listeners).
Match User dcrelay
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:2222
    PermitOpen none
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    ForceCommand /bin/false
    PasswordAuthentication no
